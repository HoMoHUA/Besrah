<!-- @dsCard group="Commerce" height=440 subtitle="قلب و دکمهٔ سبد را بزنید" -->
<!doctype html>
<html lang="fa" dir="rtl">
<head><meta charset="utf-8"><title>ProductCard — preview</title>
<style>
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-sans); -webkit-tap-highlight-color: transparent; }
*, *::before, *::after { box-sizing: border-box; }
.pv { padding: 16px; display: grid; gap: 14px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.cap { font-size: 11px; color: var(--muted); }
button { font-family: inherit; }
h3, h4, p { margin: 0; }
.cm-product__art{font-size:58px}</style><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><script src="../bundle.js"></script></head>
<body>
<div class="pv">
  <div class="row" style="justify-content:space-between"><b style="font-size:18px">پیشنهادهای امروز</b><button class="cm-cartbtn el" data-cm-cart aria-label="سبد خرید"><i class="hms hms-bag" aria-hidden="true"></i><span class="cm-count" data-n="0"></span></button></div>
  <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px">
<article class="cm-product rv" data-cm-product><div class="cm-product__media" style="--tint:47,51,230"><div class="cm-product__badges"><span class="cm-badge cm-badge--solid"><i class="hms hms-flame_fill" aria-hidden="true"></i>حراج</span></div><button class="cm-fav" data-cm="fav" aria-pressed="false" aria-label="افزودن به علاقه‌مندی"><span class="im" aria-hidden="true"><i class="hms hms-heart on"></i><i class="hms hms-heart_fill off"></i></span></button><i class="hms hms-headphones_fill cm-product__art" aria-hidden="true"></i></div><div class="cm-product__meta"><h3 class="cm-product__title">هدفون بی‌سیم نویزکنسلینگ</h3><div class="cm-rating"><span class="cm-stars" style="--r:4.6" aria-hidden="true"><i class="hms hms-star_fill"></i><i class="hms hms-star_fill"></i><i class="hms hms-star_fill"></i><i class="hms hms-star_fill"></i><i class="hms hms-star_fill"></i><span class="cm-stars__fill"><i class="hms hms-star_fill"></i><i class="hms hms-star_fill"></i><i class="hms hms-star_fill"></i><i class="hms hms-star_fill"></i><i class="hms hms-star_fill"></i></span></span><span>۴٫۶</span><span>(۱٬۲۴۸)</span></div></div><div class="cm-product__foot"><div class="cm-price cm-price--sale"><span class="cm-price__was"><s>۵٬۸۹۰٬۰۰۰</s><span class="cm-badge cm-badge--sale">۱۷٪</span></span><span class="cm-price__now"><b>۴٬۸۹۰٬۰۰۰</b><small>تومان</small></span></div><button class="cm-btn cm-add el" data-cm="add" aria-label="افزودن هدفون بی‌سیم نویزکنسلینگ به سبد"><span class="im" aria-hidden="true"><i class="hms hms-bag on"></i><i class="hms hms-checkmark off"></i></span></button></div></article><article class="cm-product rv" data-cm-product><div class="cm-product__media" style="--tint:6,122,102"><div class="cm-product__badges"><span class="cm-badge cm-badge--new">جدید</span></div><button class="cm-fav" data-cm="fav" aria-pressed="false" aria-label="افزودن به علاقه‌مندی"><span class="im" aria-hidden="true"><i class="hms hms-heart on"></i><i class="hms hms-heart_fill off"></i></span></button><i class="hms hms-watch cm-product__art" aria-hidden="true"></i></div><div class="cm-product__meta"><h3 class="cm-product__title">ساعت هوشمند ورزشی GPS</h3><div class="cm-rating"><span class="cm-stars" style="--r:4.3" aria-hidden="true"><i class="hms hms-star_fill"></i><i class="hms hms-star_fill"></i><i class="hms hms-star_fill"></i><i class="hms hms-star_fill"></i><i class="hms hms-star_fill"></i><span class="cm-stars__fill"><i class="hms hms-star_fill"></i><i class="hms hms-star_fill"></i><i class="hms hms-star_fill"></i><i class="hms hms-star_fill"></i><i class="hms hms-star_fill"></i></span></span><span>۴٫۳</span><span>(۵۴۰)</span></div></div><div class="cm-product__foot"><div class="cm-price"><span class="cm-price__now"><b>۳٬۲۹۰٬۰۰۰</b><small>تومان</small></span></div><button class="cm-btn cm-add el" data-cm="add" aria-label="افزودن ساعت هوشمند ورزشی GPS به سبد"><span class="im" aria-hidden="true"><i class="hms hms-bag on"></i><i class="hms hms-checkmark off"></i></span></button></div></article><article class="cm-product rv is-out" data-cm-product><div class="cm-product__media" style="--tint:208,16,42"><div class="cm-product__badges"></div><button class="cm-fav" data-cm="fav" aria-pressed="false" aria-label="افزودن به علاقه‌مندی"><span class="im" aria-hidden="true"><i class="hms hms-heart on"></i><i class="hms hms-heart_fill off"></i></span></button><i class="hms hms-shoe cm-product__art" aria-hidden="true"></i></div><div class="cm-product__meta"><h3 class="cm-product__title">کفش رانینگ سبک</h3><div class="cm-rating"><span class="cm-stars" style="--r:4.8" aria-hidden="true"><i class="hms hms-star_fill"></i><i class="hms hms-star_fill"></i><i class="hms hms-star_fill"></i><i class="hms hms-star_fill"></i><i class="hms hms-star_fill"></i><span class="cm-stars__fill"><i class="hms hms-star_fill"></i><i class="hms hms-star_fill"></i><i class="hms hms-star_fill"></i><i class="hms hms-star_fill"></i><i class="hms hms-star_fill"></i></span></span><span>۴٫۸</span><span>(۲۱۰)</span></div></div><div class="cm-product__foot"><span class="cm-badge cm-badge--warn">ناموجود</span><button class="cm-btn cm-btn--line cm-btn--sm el" data-cm-notify><i class="hms hms-bell" aria-hidden="true"></i>خبرم کن</button></div></article>
  </div>
</div>
<script>
document.querySelectorAll('[data-cm-notify]').forEach(function (b) { b.addEventListener('click', function () {
  b.disabled = true; b.innerHTML = '<i class="hms hms-checkmark" aria-hidden="true"></i>نفر ۱۲ در صف';
}); });
HM7.init(document.body);
</script>
</body>
</html>
