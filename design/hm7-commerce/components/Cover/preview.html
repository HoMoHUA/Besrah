<!doctype html>
<html lang="fa">
<head><meta charset="utf-8"><title>HM7 Commerce — cover</title>
<style>
body { margin: 0; background: var(--bg); }
.cv { position: relative; width: 960px; height: 300px; font-family: var(--font-sans); }
.cv svg { position: absolute; inset: 0; }
.b-co { fill: var(--hm7-cobalt); } .b-lo { fill: var(--hm7-cobalt-lo); } .b-ink { fill: var(--ink); } .b-sale { fill: var(--sale); } .b-rib { fill: var(--hm7-ribbon); } .g { fill: var(--bg); }
.cv-name { position: absolute; left: 40px; bottom: 62px; margin: 0; font-size: 84px; line-height: .95; font-weight: 900; letter-spacing: -1px; color: var(--ink); direction: ltr; }
.cv-tag { position: absolute; left: 44px; bottom: 30px; margin: 0; font: 500 13px/1.5 var(--font-sans); color: var(--muted); direction: rtl; max-width: 440px; }
</style><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><script src="../bundle.js"></script></head>
<body>
<div class="cv">

<circle class="g" cx="740" cy="18" r="7"/><circle class="g" cx="740" cy="42" r="7"/><circle class="g" cx="740" cy="66" r="7"/><circle class="g" cx="740" cy="90" r="7"/><circle class="g" cx="740" cy="114" r="7"/><circle class="g" cx="740" cy="138" r="7"/><circle class="g" cx="740" cy="162" r="7"/><circle class="g" cx="740" cy="186" r="7"/><circle class="g" cx="740" cy="210" r="7"/><circle class="g" cx="740" cy="234" r="7"/><circle class="g" cx="740" cy="258" r="7"/><circle class="g" cx="740" cy="282" r="7"/>
</svg>
<p class="cv-name">HM7<br>Commerce</p>
<p class="cv-tag">سیستم طراحی فروشگاه‌ها و وب‌اپ‌های تعاملی — نور، شیشه و فنر</p>
</div>
