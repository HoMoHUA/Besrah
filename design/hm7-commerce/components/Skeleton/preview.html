<!-- @dsCard group="Commerce" height=380 subtitle="«بارگذاری دوباره»" -->
<!doctype html>
<html lang="fa" dir="rtl">
<head><meta charset="utf-8"><title>Skeleton — preview</title>
<style>
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-sans); -webkit-tap-highlight-color: transparent; }
*, *::before, *::after { box-sizing: border-box; }
.pv { padding: 16px; display: grid; gap: 14px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.cap { font-size: 11px; color: var(--muted); }
button { font-family: inherit; }
h3, h4, p { margin: 0; }
</style><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><script src="../bundle.js"></script></head>
<body>
<div class="pv">
  <div id="g" style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px"></div>
  <button class="cm-btn cm-btn--ghost cm-btn--sm el" id="rl" style="justify-self:start">بارگذاری دوباره</button>
</div>
<script>
var g = document.getElementById('g'), D = [['هدفون بی‌سیم','headphones_fill','47,51,230',4890000],['ساعت ورزشی','watch','6,122,102',3290000],['کفش رانینگ','shoe','208,16,42',2150000]];
function skel() { g.innerHTML = ''; for (var i = 0; i < 3; i++) g.insertAdjacentHTML('beforeend', '<div class="cm-product" aria-hidden="true"><div class="cm-skel cm-skel--media"></div><div style="display:grid;gap:8px"><div class="cm-skel cm-skel--line"></div><div class="cm-skel cm-skel--line" style="width:60%"></div></div><div class="cm-skel" style="height:22px;width:50%"></div></div>'); }
function load() { g.innerHTML = ''; D.forEach(function (d, i) { g.insertAdjacentHTML('beforeend', '<div class="cm-product is-loaded" style="animation-delay:' + (i * 60) + 'ms"><div class="cm-product__media" style="--tint:' + d[2] + '"><i class="hms hms-' + d[1] + ' cm-product__art" aria-hidden="true" style="font-size:52px"></i></div><div class="cm-product__title">' + d[0] + '</div><div class="cm-price"><span class="cm-price__now"><b>' + HM7.shop.money(d[3], { unit: false }) + '</b><small>تومان</small></span></div></div>'); }); }
function run() { skel(); setTimeout(load, 1600); }
run(); document.getElementById('rl').addEventListener('click', run);
HM7.init(document.body);
</script>
</body>
</html>
