<!-- @dsCard group="v1.6 interactions" height=300 subtitle="روش ارسال" -->
<!doctype html>
<html lang="fa" dir="rtl">
<head><meta charset="utf-8"><title>Radio — preview</title>
<style>
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-sans); -webkit-tap-highlight-color: transparent; }
*, *::before, *::after { box-sizing: border-box; }
.pv { padding: 16px; display: grid; gap: 14px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.cap { font-size: 11px; color: var(--muted); }
button { font-family: inherit; }
h3, h4, p { margin: 0; }
</style><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><script src="../bundle.js"></script></head>
<body>
<div class="pv" style="max-width:460px">
  <div style="display:flex;flex-direction:column;gap:8px" data-radio aria-label="روش ارسال">
    <div class="ro sel"><div class="ro-ico"><i class="hms hms-truck_box_fill" aria-hidden="true" style="font-size:20px;color:var(--accent)"></i></div><div style="flex:1"><div style="font-size:13px;font-weight:700">پست پیشتاز</div><div style="font-size:11px;color:var(--muted)">۳ تا ۵ روز کاری</div></div><b style="font-size:13px;margin-inline-end:8px">۹۰٬۰۰۰ <small style="font-weight:400;color:var(--muted)">تومان</small></b><div class="ro-chk"><i class="hms hms-checkmark" aria-hidden="true" style="color:#fff;font-size:12px"></i></div></div>
    <div class="ro"><div class="ro-ico"><i class="hms hms-bolt" aria-hidden="true" style="font-size:20px;color:var(--warning)"></i></div><div style="flex:1"><div style="font-size:13px;font-weight:700">پیک فوری</div><div style="font-size:11px;color:var(--muted)">امروز تا ساعت ۲۱ — فقط تهران</div></div><b style="font-size:13px;margin-inline-end:8px">۱۸۰٬۰۰۰ <small style="font-weight:400;color:var(--muted)">تومان</small></b><div class="ro-chk"><i class="hms hms-checkmark" aria-hidden="true" style="color:#fff;font-size:12px"></i></div></div>
    <div class="ro"><div class="ro-ico"><i class="hms hms-house_fill" aria-hidden="true" style="font-size:20px;color:var(--success)"></i></div><div style="flex:1"><div style="font-size:13px;font-weight:700">تحویل حضوری</div><div style="font-size:11px;color:var(--muted)">از فردا، فروشگاه مرکزی</div></div><b style="font-size:13px;margin-inline-end:8px;color:var(--success)">رایگان</b><div class="ro-chk"><i class="hms hms-checkmark" aria-hidden="true" style="color:#fff;font-size:12px"></i></div></div>
  </div>
</div>
<script>
HM7.init(document.body);
</script>
</body>
</html>
