<!-- @dsCard group="Commerce" height=130 subtitle="کم و زیاد کنید" -->
<!doctype html>
<html lang="fa" dir="rtl">
<head><meta charset="utf-8"><title>QuantityStepper — preview</title>
<style>
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-sans); -webkit-tap-highlight-color: transparent; }
*, *::before, *::after { box-sizing: border-box; }
.pv { padding: 16px; display: grid; gap: 14px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.cap { font-size: 11px; color: var(--muted); }
button { font-family: inherit; }
h3, h4, p { margin: 0; }
</style><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><script src="../bundle.js"></script></head>
<body>
<div class="pv">
  <div class="row" style="gap:24px">
    <div style="display:grid;gap:6px;justify-items:start"><span class="cap">عادی (۱ تا ۱۰)</span><div data-cm="qty" data-value="2" aria-label="تعداد"></div></div>
    <div style="display:grid;gap:6px;justify-items:start"><span class="cap">در سبد (سطل در ۱)</span><div data-cm="qty" data-value="1" data-removable aria-label="تعداد در سبد" id="rm"></div></div>
    <div style="display:grid;gap:6px;justify-items:start"><span class="cap">حراج (سقف ۳)</span><div data-cm="qty" data-value="2" data-max="3" aria-label="تعداد حراج"></div></div>
  </div>
  <div class="cap" id="msg" aria-live="polite"></div>
</div>
<script>
HM7.shop.qty(document.getElementById('rm'), { removable: true, onRemove: function () { document.getElementById('msg').textContent = 'onRemove: در سبد، اینجا ردیف حذف می‌شود.'; } });
HM7.init(document.body);
</script>
</body>
</html>
