<!doctype html>
<html lang="fa" dir="rtl">
<head><meta charset="utf-8"><title>Elastic — preview</title>
<style>

.pv { padding: 16px; display: grid; gap: 14px; }

  <div class="row">
    <button class="el-d cm-cartbtn" aria-label="علاقه‌مندی"><span class="si"><i class="hms hms-heart" aria-hidden="true"></i></span></button>
    <button class="el-d cm-cartbtn" aria-label="اشتراک"><span class="si"><i class="hms hms-share" aria-hidden="true"></i></span></button>
    <button class="el-d cm-cartbtn" aria-label="سبد" style="background:var(--accent);color:var(--on-accent)"><span class="si"><i class="hms hms-bag_fill" aria-hidden="true"></i></span></button>
