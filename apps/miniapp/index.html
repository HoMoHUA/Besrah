<!doctype html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#061C1D">
<meta name="color-scheme" content="dark light">
<title>Besrah · بِسراه</title>
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preload" href="vendor/hm7/fonts/AzarMehr-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="vendor/hm7/tokens.css">
<link rel="stylesheet" href="skin.css">
<link rel="stylesheet" href="vendor/hm7/components/bundle.css">
<link rel="stylesheet" href="app.css">
<script src="assets/telegram-web-app.js"></script>
<script src="theme-boot.js"></script>
<script defer src="vendor/hm7/components/bundle.js"></script>

</head>
<body class="cm-page">
<a class="skip-link" href="#main">رفتن به محتوا</a>
<div class="app" id="app">
  <div class="app-top" id="app-top">
    <div class="edge edge--top" aria-hidden="true"></div>
    <header class="cm-frost cm-header app-header" id="header">
      <a class="app-brand" href="./" aria-label="Besrah، خانه"><img src="assets/logo.svg" width="40" height="40" alt=""></a>
      <div class="app-search" id="search-host">
        <label class="cm-search cm-inset app-search__field" for="q">
          <i class="hms hms-magnifyingglass" aria-hidden="true"></i>
          <input id="q" type="text" inputmode="search" enterkeyhint="search" autocomplete="off" autocapitalize="off" spellcheck="false"
            role="combobox" aria-expanded="false" aria-controls="suggest-list" aria-autocomplete="list" aria-label="جست وجو در سرویس های بِسراه" placeholder="دنبال کدام سرویس هستید؟">
          <button class="cm-qty__b search-clear" id="q-clear" type="button" hidden aria-label="پاک کردن جست وجو"><i class="hms hms-xmark_circle_fill" aria-hidden="true"></i></button>
        </label>
        <div class="cm-menu app-suggest" id="suggest" hidden>
          <div id="suggest-list" role="listbox" aria-label="سرویس های بِسراه"></div>
        </div>
        <p class="cm-sr" id="suggest-live" role="status" aria-live="polite"></p>
      </div>
      <button class="cm-cartbtn el app-menu-btn" id="menu-btn" type="button" aria-label="منو" aria-haspopup="menu" data-hm7-morph="menu"><i class="hms hms-line_3_horizontal" aria-hidden="true"></i></button>
      <div class="cm-menu hm7-morph app-menu" id="menu" role="menu" aria-label="منو"><div class="hm7-morph__content" id="menu-content"></div></div>
    </header>
  </div>
  <main class="app-main" id="main" tabindex="-1"><div class="app-panel" id="panel" role="tabpanel"></div></main>
  <div class="edge edge--bottom" aria-hidden="true"></div>
  <nav class="hm7-glass cm-frost hm7-tabs cm-bottom app-nav" id="nav" aria-label="منوی اصلی">
    <button class="hm7-tabs__item is-active" type="button" data-view="home" aria-controls="panel"><i class="hms hms-house" aria-hidden="true"></i>خانه</button>
    <button class="hm7-tabs__item" type="button" data-view="saved" aria-controls="panel"><i class="hms hms-heart" aria-hidden="true"></i>ذخیره ها</button>
    <button class="hm7-tabs__item hm7-tabs__item--hub" type="button" data-view="services" aria-controls="panel"><i class="hms hms-square_grid_2x2" aria-hidden="true"></i>سرویس ها</button>
    <button class="hm7-tabs__item" type="button" data-view="settings" aria-controls="panel"><i class="hms hms-gearshape" aria-hidden="true"></i>تنظیمات</button>
    <button class="hm7-tabs__item" type="button" data-view="about" aria-controls="panel"><i class="hms hms-info_circle" aria-hidden="true"></i>درباره</button>
  </nav>
</div>
<div class="cm-toasts app-toasts" id="toasts" aria-label="اعلان ها"></div>
<div id="sheet-root"></div>
<p class="cm-sr" id="announce" role="status" aria-live="polite"></p>
<noscript><p class="app-noscript">برای استفاده از بِسراه، جاوااسکریپت را فعال کنید.</p></noscript>

</html>
