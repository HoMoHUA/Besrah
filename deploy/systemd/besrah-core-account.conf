# Drop-in for besrah-core: optional accounts. Without BESRAH_ACCOUNT_DB the app is guest-only. The database lives in a systemd-managed
# private state directory (0700); it holds only an internal account id, the Telegram numeric id, consents, preferences and hashed sessions.
# The bot id is public (the first part of the bot token); no bot secret is needed because Telegram initData is verified with Telegram's published Ed25519 key.
[Service]
StateDirectory=besrah-account
StateDirectoryMode=0700
Environment=BESRAH_ACCOUNT_DB=/var/lib/besrah-account/accounts.db
Environment=BESRAH_TELEGRAM_BOT_ID=9195157620
