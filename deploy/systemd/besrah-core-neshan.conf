# Drop-in for besrah-core: the routing key lives in a root-only file, never in the unit, the repo or a log.
# /etc/besrah-maps/neshan.env (0600 root) contains one line: BESRAH_NESHAN_KEY=<value>
# Optional per-service keys: BESRAH_NESHAN_DIRECTION_KEY, BESRAH_NESHAN_GEOCODING_KEY. Optional: BESRAH_NESHAN_DAILY_CAP (default 2000 calls/day).
[Service]
EnvironmentFile=-/etc/besrah-maps/neshan.env
