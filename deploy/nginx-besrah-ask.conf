# F1 (2026-11-20): «از بسراه بپرس». POST only, so the question never appears in a URL or an access log.
# The read timeout covers the model fallback (9 s on the core side) for unclear questions.
location = /api/ask {
    if ($args != "") { return 400; }
    limit_except POST { deny all; }
    client_max_body_size 1k;
    client_body_timeout 5s;
    limit_req zone=besrah_api burst=4 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:3080/app/api/ask;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 12s;
    proxy_send_timeout 6s;
    proxy_buffering off;
    access_log off;
    error_log /dev/null crit;
}
