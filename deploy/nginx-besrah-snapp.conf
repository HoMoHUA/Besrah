# F4 (2026-11-20): Snapp ride prices and the person's own Snapp login. POST only; bodies carry a phone number, an SMS
# code or a device-held session, so nothing is logged (access_log off) and nothing is cached.
# Exact locations: they win over the generic `location ^~ /api/`, which would otherwise take these paths before any regex
# location is checked (and allows only GET). GET /api/snapp/config stays on that generic location.
location = /api/snapp/otp {
    if ($args != "") { return 400; }
    limit_except POST { deny all; }
    client_max_body_size 8k;
    client_body_timeout 5s;
    limit_req zone=besrah_api burst=4 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:3080/app/api/snapp/otp;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 25s;
    proxy_send_timeout 6s;
    proxy_buffering off;
    access_log off;
    error_log /dev/null crit;
}

