# Besrah Mini App on its own host (besrah.arklyn.ir): include inside that host's server blocks.
# The core serves the app under /app/ on loopback; the public edge maps it to the site root.
# The app uses relative URLs, so the root mount works unchanged.
add_header X-Robots-Tag "noindex" always;

location = /robots.txt {
    default_type text/plain;
    return 200 "User-agent: *\nDisallow: /\n";
}

location ^~ /api/ {
    # Public users do not need arbitrary-date queries. The private core keeps `at=` for field-data and smoke tests.
    if ($arg_at != "") { return 400; }
    limit_req zone=besrah_api burst=20 nodelay;
    limit_req_status 429;
    limit_except GET HEAD { deny all; }
    proxy_pass http://127.0.0.1:3080/app/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
    proxy_send_timeout 10s;
    access_log off;
}

location / {
    limit_except GET HEAD { deny all; }
    proxy_pass http://127.0.0.1:3080/app/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
    proxy_send_timeout 10s;
    access_log off;
}
