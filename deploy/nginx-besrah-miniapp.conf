# Include inside the existing TLS server for n8n.gastora.ir.
# This app is read-only and isolated under its own prefix.
location = /besrah {
    return 302 /besrah/;
}

location ^~ /besrah/api/ {
    # Public users do not need arbitrary date queries. The private core retains
    # historical at= support for deterministic field-data and smoke tests.
    if ($arg_at != "") { return 400; }
    limit_req zone=besrah_api burst=20 nodelay;
    limit_req_status 429;
    limit_except GET HEAD { deny all; }
    proxy_pass http://127.0.0.1:3080/app/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
    proxy_send_timeout 10s;
    access_log off;
}

location ^~ /besrah/ {
    limit_except GET HEAD { deny all; }
    proxy_pass http://127.0.0.1:3080/app/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
    proxy_send_timeout 10s;
    access_log off;
}
