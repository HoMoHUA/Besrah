# F6 (2026-11-20): the person's own Snapp Pay login (SSO relay) and token refresh, and H3 cells for the in-store map.
# POST only; bodies carry a phone number, an SMS code, a refresh token or a point, so nothing is logged and nothing is cached.
# Exact locations: they win over the generic `location ^~ /api/` (GET only), which would otherwise take these paths.
location = /api/snapppay/login {
    if ($args != "") { return 400; }
    limit_except POST { deny all; }
    client_max_body_size 2k;
    client_body_timeout 5s;
    limit_req zone=besrah_api burst=4 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:3080/app/api/snapppay/login;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;
    proxy_send_timeout 6s;
    proxy_buffering off;
    access_log off;
    error_log /dev/null crit;
}

