# Besrah trip planning: two JSON POST endpoints. Include inside the Besrah TLS server block, BEFORE the generic `location ^~ /api/`
# (exact locations win over prefixes). POST on purpose: the request body carries coordinates and place text, so they never appear
# in a URL. access_log is off here exactly as for /api/. Requires the existing http-level zone `besrah_api`.
# Install: copy to /etc/nginx/snippets/, add `include snippets/besrah-trip-post.conf;` to the site, `nginx -t && systemctl reload nginx`.
# Roll back: remove the include line, `nginx -t && systemctl reload nginx`.
location = /api/trip {
    if ($args != "") { return 400; }
    limit_except POST { deny all; }
    client_max_body_size 1k;
    client_body_timeout 5s;
    limit_req zone=besrah_api burst=3 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:3080/app/api/trip;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 12s;
    proxy_send_timeout 10s;
    proxy_buffering off;
    access_log off;
    error_log /dev/null crit;
}
location = /api/places {
    if ($args != "") { return 400; }
    limit_except POST { deny all; }
    client_max_body_size 512;
    client_body_timeout 5s;
    limit_req zone=besrah_api burst=5 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:3080/app/api/places;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 8s;
    proxy_send_timeout 8s;
    proxy_buffering off;
    access_log off;
    error_log /dev/null crit;
}
