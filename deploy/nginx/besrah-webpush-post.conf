# Include inside the Besrah TLS server block. Exact locations override the read-only /api/ prefix.
# Keep request bodies, push endpoints and deletion tokens out of access/error logs.
location = /api/reminders {
    if ($args != "") { return 400; }
    limit_except POST { deny all; }
    client_max_body_size 4k;
    client_body_timeout 5s;
    limit_req zone=besrah_api burst=3 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:3080/app/api/reminders;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
    proxy_send_timeout 10s;
    proxy_buffering off;
    access_log off;
    error_log /dev/null crit;
}
location = /api/reminders/delete {
    if ($args != "") { return 400; }
    limit_except POST { deny all; }
    client_max_body_size 512;
    client_body_timeout 5s;
    limit_req zone=besrah_api burst=3 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:3080/app/api/reminders/delete;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
    proxy_send_timeout 10s;
    proxy_buffering off;
    access_log off;
    error_log /dev/null crit;
}
