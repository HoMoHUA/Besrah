# Besrah accounts and home suggestions. Include inside the Besrah TLS server block, next to besrah-trip-post.conf and BEFORE the generic
# `location ^~ /api/` (the longer prefix and the exact match win). Account calls carry the session cookie, so access_log is off,
# bodies are tiny, and the existing http-level zone `besrah_api` rate-limits them. Only GET (session/consents/preferences) and POST are allowed.
# Install: copy to /etc/nginx/snippets/, add `include snippets/besrah-account-post.conf;`, `nginx -t && systemctl reload nginx`.
# Roll back: remove the include line, `nginx -t && systemctl reload nginx` (the app then simply cannot reach the account API and stays guest-only).
location ^~ /api/account/ {
    limit_except GET POST { deny all; }
    client_max_body_size 8k;
    client_body_timeout 5s;
    limit_req zone=besrah_api burst=6 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:3080/app/api/account/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 8s;
    proxy_send_timeout 8s;
    proxy_buffering off;
    access_log off;
    error_log /dev/null crit;
}
location = /api/recommendations/home {
    if ($args != "") { return 400; }
    limit_except POST { deny all; }
    client_max_body_size 512;
    client_body_timeout 5s;
    limit_req zone=besrah_api burst=4 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:3080/app/api/recommendations/home;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 6s;
    proxy_send_timeout 6s;
    proxy_buffering off;
    access_log off;
    error_log /dev/null crit;
}
