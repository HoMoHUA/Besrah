# U12 (2026-11-19): profile code (stateless describe), live bus arrivals and official stop search.
location = /api/profile/describe {
    if ($args != "") { return 400; }
    limit_except POST { deny all; }
    client_max_body_size 1k;
    client_body_timeout 5s;
    limit_req zone=besrah_api burst=4 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:3080/app/api/profile/describe;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 6s;
    proxy_send_timeout 6s;
    proxy_buffering off;
    access_log off;
    error_log /dev/null crit;
}
location = /api/bus/stops {
    if ($args != "") { return 400; }
    limit_except POST { deny all; }
    client_max_body_size 512;
    client_body_timeout 5s;
    limit_req zone=besrah_api burst=6 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:3080/app/api/bus/stops;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 6s;
    proxy_send_timeout 6s;
    proxy_buffering off;
    access_log off;
    error_log /dev/null crit;
}
location = /api/bus/eta {
    limit_except GET HEAD { deny all; }
    limit_req zone=besrah_api burst=6 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:3080/app/api/bus/eta;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
    proxy_send_timeout 6s;
    access_log off;
}
