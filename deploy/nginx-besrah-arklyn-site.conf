# /etc/nginx/sites-available/besrah.arklyn.ir.conf (TLS blocks are added by certbot --nginx)
server {
    listen 80;
    listen [::]:80;
    server_name besrah.arklyn.ir;

    client_max_body_size 16k;
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/manifest+json image/svg+xml;

    include /etc/nginx/snippets/besrah-miniapp-root.conf;
}
