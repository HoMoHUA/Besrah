# Candidate-only fragment: include inside the existing Besrah TLS server AFTER owner GO.
# Do not replace the GET-only /api/ or / locations. An exact location wins over those prefixes.
# Requires the EXISTING http-level besrah_api limit zone; never install a global POST exception.
location = /api/journey-feedback {
    if ($args != "") { return 400; }
    limit_except POST { deny all; }
    client_max_body_size 4k;
    client_body_timeout 5s;
    limit_req zone=besrah_api burst=5 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:3080/app/api/journey-feedback;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
    proxy_send_timeout 10s;
    proxy_buffering off;
    access_log off;
    error_log /dev/null crit;
}
